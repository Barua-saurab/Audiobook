<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Fitness Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            text-align: center; 
        }
        input, button { 
            padding: 10px; 
            margin: 5px; 
            font-size: 16px; 
        }
        button {
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .water-btn {
            background-color: #007bff;
        }
        canvas { 
            margin-top: 20px; 
        }
        .section {
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <h2>Daily Tracker</h2>
    
    <input type="date" id="dateInput">

    <div class="section">
        <h3>Push-ups</h3>
        <input type="number" id="pushupInput" placeholder="Number of push-ups" min="1">
        <button onclick="saveData('pushup')">Add Push-ups</button>
        <canvas id="pushupChart"></canvas>
    </div>

    <div class="section">
        <h3>Water Intake</h3>
        <input type="number" id="waterInput" placeholder="Water in ml" min="1">
        <button class="water-btn" onclick="saveData('water')">Add Water</button>
        <canvas id="waterChart"></canvas>
    </div>

    <script>
        document.getElementById('dateInput').valueAsDate = new Date();

        let pushupChartObj = null;
        let waterChartObj = null;

        // A single function to draw either the push-up or water chart
        function drawChart(type, canvasId, labelText, lineColor, existingChart) {
            const data = JSON.parse(localStorage.getItem(type + 'History')) || {};
            const sortedDates = Object.keys(data).sort();
            const counts = sortedDates.map(date => data[date]);

            const ctx = document.getElementById(canvasId).getContext('2d');
            
            if (existingChart) {
                existingChart.destroy();
            }

            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedDates,
                    datasets: [{
                        label: labelText,
                        data: counts,
                        borderColor: lineColor,
                        backgroundColor: lineColor,
                        tension: 0.1
                    }]
                },
                options: {
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function updateAllCharts() {
            pushupChartObj = drawChart('pushup', 'pushupChart', 'Push-ups', '#28a745', pushupChartObj);
            waterChartObj = drawChart('water', 'waterChart', 'Water (ml)', '#007bff', waterChartObj);
        }

        // A single function to save data for either push-ups or water
        function saveData(type) {
            const date = document.getElementById('dateInput').value;
            const inputField = document.getElementById(type + 'Input');
            const count = parseInt(inputField.value);

            if (!date || isNaN(count)) {
                alert("Please enter a valid date and number.");
                return;
            }

            const storageKey = type + 'History';
            const data = JSON.parse(localStorage.getItem(storageKey)) || {};
            
            data[date] = (data[date] || 0) + count;
            
            localStorage.setItem(storageKey, JSON.stringify(data));
            inputField.value = ''; 
            
            updateAllCharts(); 
        }

        updateAllCharts();
    </script>

</body>
</html>
