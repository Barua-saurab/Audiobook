<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Writer's Blog</title>
<style>
  /* General page styling */
  body {
    background-color: #eaddd3; /* Soft desk color */
    font-family: Georgia, 'Times New Roman', serif;
    color: #333;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    margin: 0;
  }

  .container {
    max-width: 700px;
    width: 100%;
  }

  h1 {
    text-align: center;
    font-family: 'Courier New', Courier, monospace;
    color: #4a4a4a;
  }

  /* The Margined Paper Design */
  .paper {
    background-color: #fffdf8; /* Off-white paper */
    padding: 40px 40px 40px 60px;
    position: relative;
    box-shadow: 2px 4px 15px rgba(0, 0, 0, 0.2);
    border-radius: 2px;
    font-size: 1.15em;
    line-height: 2em; /* Spacing for the ruled lines */
    
    /* Ruled line effect */
    background-image: linear-gradient(transparent 95%, #e0e0e0 95%);
    background-size: 100% 2em;
  }

  /* Red vertical margin */
  .paper::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 40px;
    width: 2px;
    background-color: #e06c6c;
  }

  /* Typography on the paper */
  .paper h2 {
    margin-top: 0;
    line-height: 1.2;
  }
  
  .paper p {
    margin: 0; /* Keep text aligned with ruled lines */
  }

  /* Interactive Elements */
  .post-link {
    cursor: pointer;
    color: #b7410e;
    font-weight: bold;
    font-size: 1.2em;
  }
  
  .post-link:hover {
    text-decoration: underline;
  }

  .back-button {
    cursor: pointer;
    color: #555;
    font-family: sans-serif;
    margin-bottom: 20px;
    display: inline-block;
  }
  
  .back-button:hover {
    color: #000;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Thoughts & Ink</h1>
  <div id="blog-content"></div>
</div>

<script>
  // Your blog posts stored as JSON objects
  const posts = [
    {
      id: 1,
      title: "The First Draft",
      date: "September 14, 2026",
      content: "Writing is a process of discovery. The blank page can be intimidating, but it is also a canvas for new ideas. Every word brings the story slightly more into focus."
    },
    {
      id: 2,
      title: "Finding Inspiration",
      date: "September 10, 2026",
      content: "Sometimes inspiration strikes during a quiet walk, or while reading an old book. The key is to always keep a notebook nearby to capture those fleeting moments."
    }
  ];

  const contentDiv = document.getElementById('blog-content');

  // Function to show the home page list
  function renderHome() {
    let html = '<h2>Recent Entries</h2><ul>';
    posts.forEach(post => {
      html += `
        <li style="margin-bottom: 15px; list-style-type: none;">
          <span class="post-link" onclick="renderPost(${post.id})">${post.title}</span><br>
          <small style="color: #666;">${post.date}</small>
        </li>`;
    });
    html += '</ul>';
    contentDiv.innerHTML = html;
  }

  // Function to show the margined paper reading view
  function renderPost(id) {
    const post = posts.find(p => p.id === id);
    contentDiv.innerHTML = `
      <span class="back-button" onclick="renderHome()">← Back to Home</span>
      <div class="paper">
        <h2>${post.title}</h2>
        <p><i>${post.date}</i></p><br>
        <p>${post.content}</p>
      </div>
    `;
  }

  // Load the home page when the file is opened
  renderHome();
</script>

</body>
</html>
