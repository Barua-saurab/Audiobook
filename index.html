<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Fitness Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; text-align: center; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; }
        button { cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px; }
        .water-btn { background-color: #007bff; }
        canvas { margin-top: 20px; }
        .section { margin-bottom: 50px; padding-bottom: 30px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>

    <h2>Daily Tracker</h2>
    
    <input type="date" id="dateInput">

    <div class="section">
        <h3>Push-ups</h3>
        <input type="number" id="pushupInput" placeholder="Number of push-ups" min="1">
        <button onclick="saveData('pushup')">Add Push-ups</button>
        <canvas id="pushupChart"></canvas>
    </div>

    <div class="section">
        <h3>Water Intake</h3>
        <input type="number" id="waterInput" placeholder="Water in ml" min="1">
        <button class="water-btn" onclick="saveData('water')">Add Water</button>
        <canvas id="waterChart"></canvas>
    </div>

    <script>
        // Connected to your Hetzner server IP
        const API_URL = 'http://91.99.54.224:5000'; 

        document.getElementById('dateInput').valueAsDate = new Date();

        let pushupChartObj = null;
        let waterChartObj = null;

        async function loadHistory() {
            try {
                const response = await fetch(API_URL + '/history');
                const data = await response.json();

                const pushups = { labels: [], values: [] };
                const water = { labels: [], values: [] };

                data.forEach(row => {
                    if (row.activity_type === 'pushup') {
                        pushups.labels.push(row.date);
                        pushups.values.push(row.total);
                    } else if (row.activity_type === 'water') {
                        water.labels.push(row.date);
                        water.values.push(row.total);
                    }
                });

                drawCharts(pushups, water);
            } catch (error) {
                console.error('Failed to load data:', error);
            }
        }

        function drawCharts(pushupData, waterData) {
            pushupChartObj = createChart('pushupChart', 'Push-ups', '#28a745', pushupData, pushupChartObj);
            waterChartObj = createChart('waterChart', 'Water (ml)', '#007bff', waterData, waterChartObj);
        }

        function createChart(canvasId, labelText, lineColor, data, existingChart) {
            if (existingChart) existingChart.destroy();
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{ label: labelText, data: data.values, borderColor: lineColor, backgroundColor: lineColor, tension: 0.1 }]
                },
                options: { scales: { y: { beginAtZero: true } } }
            });
        }

        async function saveData(type) {
            const date = document.getElementById('dateInput').value;
            const inputField = document.getElementById(type + 'Input');
            const amount = parseInt(inputField.value);

            if (!date || isNaN(amount)) {
                alert("Please enter a valid date and number.");
                return;
            }

            try {
                const response = await fetch(API_URL + '/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date: date, type: type, amount: amount })
                });

                if (response.ok) {
                    inputField.value = ''; 
                    loadHistory(); 
                } else {
                    alert("Failed to save data.");
                }
            } catch (error) {
                console.error('Error saving data:', error);
                alert("Could not connect to the server.");
            }
        }

        loadHistory();
    </script>

</body>
</html>
