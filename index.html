<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Writer's Blog</title>
<style>
  body {
    background-color: #eaddd3;
    font-family: Georgia, 'Times New Roman', serif;
    color: #333;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    margin: 0;
  }

  .container {
    max-width: 750px;
    width: 100%;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
    border-bottom: 1px solid #c9b7ac;
    padding-bottom: 20px;
  }

  h1 {
    font-family: 'Courier New', Courier, monospace;
    color: #4a4a4a;
    margin: 0 0 10px 0;
  }

  .tagline {
    font-style: italic;
    color: #666;
  }

  /* Blog Feed Styling */
  .post-card {
    background-color: #fffdf8;
    padding: 25px 30px;
    margin-bottom: 25px;
    box-shadow: 1px 3px 10px rgba(0, 0, 0, 0.1);
    border-radius: 3px;
    transition: transform 0.2s ease;
  }

  .post-card:hover {
    transform: translateY(-2px);
  }

  .post-meta {
    font-size: 0.85em;
    color: #888;
    margin-bottom: 8px;
  }

  .post-title {
    font-size: 1.4em;
    color: #b7410e;
    cursor: pointer;
    margin: 0 0 10px 0;
  }

  .post-title:hover {
    text-decoration: underline;
  }

  .post-excerpt {
    line-height: 1.6;
    color: #444;
  }

  /* Margined Reading View Styling */
  .paper {
    background-color: #fffdf8;
    padding: 40px 40px 40px 65px;
    position: relative;
    box-shadow: 2px 4px 15px rgba(0, 0, 0, 0.15);
    border-radius: 2px;
    font-size: 1.1em;
    line-height: 2em;
    background-image: linear-gradient(transparent 95%, #e0e0e0 95%);
    background-size: 100% 2em;
  }

  .paper::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 45px;
    width: 2px;
    background-color: #e06c6c;
  }

  .paper h2 {
    margin-top: 0;
    line-height: 1.3;
    color: #222;
  }

  .paper p {
    margin: 0 0 1em 0;
  }

  .back-button {
    cursor: pointer;
    color: #555;
    font-family: sans-serif;
    font-size: 0.9em;
    margin-bottom: 20px;
    display: inline-block;
    background: #d8cec4;
    padding: 6px 12px;
    border-radius: 4px;
  }
  
  .back-button:hover {
    background: #ccbfa3;
    color: #000;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Thoughts & Ink</h1>
    <div class="tagline">A personal journal on writing, photography, and life.</div>
  </header>

  <div id="app"></div>
</div>

<script>
  // Add your blog posts here easily
  const posts = [
    {
      id: 1,
      title: "The First Draft",
      date: "September 14, 2026",
      category: "Writing",
      content: "Writing is a process of discovery. The blank page can be intimidating, but it is also a canvas for new ideas. Every word brings the story slightly more into focus. When you sit down to write, let go of the need for perfection and just follow the thread of your thought."
    },
    {
      id: 2,
      title: "Finding Inspiration in Quiet Places",
      date: "September 10, 2026",
      category: "Reflections",
      content: "Sometimes inspiration strikes during a quiet walk, or while observing the light change across an afternoon landscape. The key is to always keep a notebook nearby to capture those fleeting moments before they slip away into the rush of everyday life."
    }
  ];

  const appDiv = document.getElementById('app');

  function renderHome() {
    let html = '';
    posts.forEach(post => {
      html += `
        <div class="post-card">
          <div class="post-meta">${post.date} &bull; <i>${post.category}</i></div>
          <h2 class="post-title" onclick="renderPost(${post.id})">${post.title}</h2>
          <div class="post-excerpt">${post.content.substring(0, 120)}...</div>
          <br>
          <span style="font-size: 0.9em; color: #b7410e; cursor: pointer; font-weight: bold;" onclick="renderPost(${post.id})">Read Entry &rarr;</span>
        </div>`;
    });
    appDiv.innerHTML = html;
  }

  function renderPost(id) {
    const post = posts.find(p => p.id === id);
    appDiv.innerHTML = `
      <span class="back-button" onclick="renderHome()">&larr; Back to all posts</span>
      <div class="paper">
        <h2>${post.title}</h2>
        <div style="font-size: 0.85em; color: #666; margin-bottom: 20px;">${post.date} &bull; <i>${post.category}</i></div>
        <p>${post.content}</p>
      </div>
    `;
  }

  renderHome();
</script>

</body>
</html>
