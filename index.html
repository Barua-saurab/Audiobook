<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push-up Tracker</title>
    <!-- Load Chart.js for the line chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 500px; 
            margin: 40px auto; 
            text-align: center; 
        }
        input, button { 
            padding: 10px; 
            margin: 5px; 
            font-size: 16px; 
        }
        button {
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
        }
        canvas { 
            margin-top: 30px; 
        }
    </style>
</head>
<body>

    <h2>Daily Push-up Tracker</h2>
    
    <input type="date" id="dateInput">
    <input type="number" id="pushupInput" placeholder="Number of push-ups" min="1">
    <button onclick="savePushups()">Add</button>

    <canvas id="pushupChart"></canvas>

    <script>
        // Set today's date automatically
        document.getElementById('dateInput').valueAsDate = new Date();

        let chart = null;

        function getSavedData() {
            const data = JSON.parse(localStorage.getItem('pushupHistory')) || {};
            // Sort dates from oldest to newest
            const sortedDates = Object.keys(data).sort();
            const counts = sortedDates.map(date => data[date]);
            return { labels: sortedDates, values: counts };
        }

        function drawChart() {
            const data = getSavedData();
            const ctx = document.getElementById('pushupChart').getContext('2d');

            // Clear old chart before drawing a new one
            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Push-ups',
                        data: data.values,
                        borderColor: '#007bff',
                        backgroundColor: '#007bff',
                        tension: 0.1
                    }]
                },
                options: {
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function savePushups() {
            const date = document.getElementById('dateInput').value;
            const count = parseInt(document.getElementById('pushupInput').value);

            if (!date || isNaN(count)) {
                alert("Please enter a valid date and number.");
                return;
            }

            const data = JSON.parse(localStorage.getItem('pushupHistory')) || {};
            
            // Add to the existing count if you enter multiple times a day
            data[date] = (data[date] || 0) + count;
            
            localStorage.setItem('pushupHistory', JSON.stringify(data));
            document.getElementById('pushupInput').value = ''; // Clear input
            
            drawChart(); // Update the chart
        }

        // Draw the chart when the page first loads
        drawChart();
    </script>

</body>
</html>
