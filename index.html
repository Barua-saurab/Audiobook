<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Mail Sender</title>
    <style>
        /* CSS for styling the page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .app-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        /* Makes the text area look a bit like real paper */
        .paper {
            background-color: #fffdf2; 
            border: 1px solid #d4cbb3;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        /* Hide the letter section initially */
        #letter-view {
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-box">
        
        <!-- Login Screen -->
        <div id="login-view">
            <h2>Log In</h2>
            <label>Email</label>
            <input type="email" id="email" placeholder="name@example.com">
            
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
            
            <button onclick="login()">Log In</button>
        </div>

        <!-- Letter Writing Screen -->
        <div id="letter-view">
            <h2>Write Your Letter</h2>
            <p style="text-align: center; color: #555;">Letters left this month: <strong>3</strong></p>
            
            <label>Customize Font:</label>
            <select id="font-style" onchange="updateFont()">
                <option value="Arial, sans-serif">Standard</option>
                <option value="'Courier New', monospace">Typewriter</option>
                <option value="'Brush Script MT', cursive">Handwriting</option>
            </select>

            <textarea id="letter-content" class="paper" rows="12" placeholder="Start typing your letter here..."></textarea>
            
            <button onclick="sendLetter()">Send Physical Letter</button>
        </div>

    </div>

    <script>
        // JavaScript for interactivity
        
        function login() {
            // Hides login and shows the letter screen
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('letter-view').style.display = 'block';
        }

        function updateFont() {
            // Changes the font inside the text area based on the dropdown
            let selectedFont = document.getElementById('font-style').value;
            document.getElementById('letter-content').style.fontFamily = selectedFont;
        }

        function sendLetter() {
            let text = document.getElementById('letter-content').value;
            if(text.trim() === "") {
                alert("Please write something before sending!");
            } else {
                alert("Success! Your letter has been sent to the printer.");
            }
        }
    </script>

</body>
</html>
