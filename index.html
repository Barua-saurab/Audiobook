<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Writer's Blog</title>
<style>
  body {
    background-color: #eaddd3;
    font-family: Georgia, 'Times New Roman', serif;
    color: #333;
    margin: 0;
    padding: 0;
  }

  /* Top Navigation Bar */
  .top-nav {
    background-color: #fbfbfc;
    text-align: center;
    padding: 25px 0;
    border-bottom: 5px solid #2c3e50;
    position: relative;
    margin-bottom: 40px;
  }

  .top-nav::after {
    content: '';
    position: absolute;
    bottom: 5px;
    left: 0;
    right: 0;
    height: 2px;
    background-color: #c0392b;
  }

  .top-nav a {
    text-decoration: none;
    color: #777;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 1.1em;
    font-weight: 300;
    margin: 0 15px;
    cursor: pointer;
  }

  .top-nav a:hover {
    color: #333;
  }

  .top-nav a.active {
    color: #a82e13;
    font-weight: bold;
  }

  .nav-divider {
    color: #a82e13;
    font-weight: 300;
  }

  /* Main Layout */
  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  h1 {
    font-family: 'Courier New', Courier, monospace;
    color: #4a4a4a;
    margin: 0 0 10px 0;
    font-size: 2.5em;
  }

  .layout {
    display: flex;
    gap: 40px;
    align-items: flex-start;
  }

  main {
    flex: 1; 
  }

  /* Sidebar styling for Categories */
  .sidebar {
    width: 250px;
    background-color: #f8f8f8;
    padding: 25px;
    border-radius: 4px;
    box-shadow: 1px 3px 10px rgba(0, 0, 0, 0.05);
  }

  .sidebar h2 {
    color: #1a365d;
    font-size: 1.8em;
    margin-top: 0;
    margin-bottom: 15px;
    font-weight: normal;
  }

  .sidebar ul {
    list-style-type: disc;
    padding-left: 20px;
    margin: 0;
  }

  .sidebar li {
    margin-bottom: 10px;
  }

  .sidebar a {
    color: #b03a1e;
    text-decoration: underline;
    text-decoration-color: #e2b4a7;
    font-size: 1.1em;
    cursor: pointer;
  }

  .sidebar a:hover {
    color: #8c2b14;
    text-decoration-color: #8c2b14;
  }

  /* Blog Feed Styling */
  .post-card {
    background-color: #fffdf8;
    padding: 25px 30px;
    margin-bottom: 25px;
    box-shadow: 1px 3px 10px rgba(0, 0, 0, 0.1);
    border-radius: 3px;
  }

  .post-meta {
    font-size: 0.85em;
    color: #888;
    margin-bottom: 8px;
  }

  .post-title {
    font-size: 1.5em;
    color: #b7410e;
    cursor: pointer;
    margin: 0 0 10px 0;
  }

  .post-title:hover {
    text-decoration: underline;
  }

  .filter-notice {
    margin-bottom: 20px;
    font-style: italic;
    color: #555;
  }

  .clear-filter {
    color: #b7410e;
    cursor: pointer;
    font-weight: bold;
  }

  /* Margined Reading View Styling */
  .paper {
    background-color: #fffdf8;
    padding: 40px 40px 40px 65px;
    position: relative;
    box-shadow: 2px 4px 15px rgba(0, 0, 0, 0.15);
    border-radius: 2px;
    font-size: 1.1em;
    line-height: 2em;
    background-image: linear-gradient(transparent 95%, #e0e0e0 95%);
    background-size: 100% 2em;
  }

  .paper::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 45px;
    width: 2px;
    background-color: #e06c6c;
  }

  .paper h2 {
    margin-top: 0;
    line-height: 1.3;
  }

  .back-button {
    cursor: pointer;
    color: #555;
    font-family: sans-serif;
    font-size: 0.9em;
    margin-bottom: 20px;
    display: inline-block;
    background: #d8cec4;
    padding: 6px 12px;
    border-radius: 4px;
  }
  
  .back-button:hover {
    background: #ccbfa3;
    color: #000;
  }
</style>
</head>
<body>

<!-- Top Navigation -->
<nav class="top-nav">
  <a onclick="alert('This would go to the Galerie page.')">Galerie</a> <span class="nav-divider">|</span>
  <a onclick="alert('This would go to the Bildarchiv page.')">Bildarchiv</a> <span class="nav-divider">|</span>
  <a onclick="alert('This would go to the Landkarte page.')">Landkarte</a> <span class="nav-divider">|</span>
  <a onclick="renderHome()" class="active">Blog</a> <span class="nav-divider">|</span>
  <a onclick="alert('This would go to the Über mich page.')">Über mich</a> <span class="nav-divider">|</span>
  <a onclick="alert('This would go to the Kontakt page.')">Kontakt</a>
</nav>

<div class="container">
  <header>
    <h1>Thoughts & Ink</h1>
  </header>

  <div class="layout">
    <!-- Main content area for blog posts -->
    <main id="app"></main>

    <!-- Sidebar with Clickable Categories -->
    <aside class="sidebar">
      <h2>Kategorien</h2>
      <ul>
        <li><a onclick="filterCategory('Fotografie allgemein')">Fotografie allgemein</a></li>
        <li><a onclick="filterCategory('Landschaftsfotografie')">Landschaftsfotografie</a></li>
        <li><a onclick="filterCategory('Fototouren')">Fototouren</a></li>
        <li><a onclick="filterCategory('Analog')">Analog</a></li>
        <li><a onclick="filterCategory('Experimentell')">Experimentell</a></li>
        <li><a onclick="filterCategory('Review')">Review</a></li>
        <li><a onclick="filterCategory('Pentax')">Pentax</a></li>
        <li><a onclick="filterCategory('Pentacon Six')">Pentacon Six</a></li>
        <li><a onclick="filterCategory('Persönliches')">Persönliches</a></li>
        <li><a onclick="filterCategory('Meinung')">Meinung</a></li>
        <li><a onclick="filterCategory('Nerd Alert')">Nerd Alert</a></li>
      </ul>
    </aside>
  </div>
</div>

<script>
  // Dummy posts using your specific categories
  const posts = [
    {
      id: 1,
      title: "The First Draft",
      date: "September 14, 2026",
      category: "Persönliches",
      content: "Writing is a process of discovery. The blank page can be intimidating, but it is also a canvas for new ideas. Every word brings the story slightly more into focus."
    },
    {
      id: 2,
      title: "Morning Light in the Valley",
      date: "September 10, 2026",
      category: "Landschaftsfotografie",
      content: "Sometimes inspiration strikes during a quiet walk, or while watching the sun rise. The key is to always keep a notebook and camera nearby to capture those fleeting moments."
    },
    {
      id: 3,
      title: "Testing the Old Lenses",
      date: "September 5, 2026",
      category: "Analog",
      content: "Today I took out some of my older gear to see how the glass holds up. There is a certain charm to the imperfections and flares that modern equipment tries to erase."
    }
  ];

  const appDiv = document.getElementById('app');

  // Renders the home page, with an optional filter for category
  function renderHome(postsToDisplay = posts, activeCategory = null) {
    let html = '';
    
    // Show a message if a filter is active
    if (activeCategory) {
      html += `
        <div class="filter-notice">
          Showing category: <b>${activeCategory}</b> 
          <span class="clear-filter" onclick="renderHome()"> (Clear Filter)</span>
        </div>`;
    }

    // Show a message if no posts match the category
    if (postsToDisplay.length === 0) {
      html += `<p>No posts found in this category.</p>`;
    }

    // Loop through the posts and create cards
    postsToDisplay.forEach(post => {
      html += `
        <div class="post-card">
          <div class="post-meta">${post.date} &bull; <i>${post.category}</i></div>
          <h2 class="post-title" onclick="renderPost(${post.id})">${post.title}</h2>
          <p style="color: #444; line-height: 1.6;">${post.content.substring(0, 100)}...</p>
          <span style="font-size: 0.9em; color: #b7410e; cursor: pointer; font-weight: bold;" onclick="renderPost(${post.id})">Read Entry &rarr;</span>
        </div>`;
    });
    
    appDiv.innerHTML = html;
  }

  // Filters the posts array and calls renderHome
  function filterCategory(categoryName) {
    const filteredPosts = posts.filter(post => post.category === categoryName);
    renderHome(filteredPosts, categoryName);
  }

  // Shows the notebook paper view for a single post
  function renderPost(id) {
    const post = posts.find(p => p.id === id);
    appDiv.innerHTML = `
      <span class="back-button" onclick="renderHome()">&larr; Back to all posts</span>
      <div class="paper">
        <h2>${post.title}</h2>
        <p style="font-size: 0.85em; color: #666; margin-bottom: 20px;"><i>${post.date} &bull; ${post.category}</i></p>
        <p>${post.content}</p>
      </div>
    `;
  }

  // Load the home page when the file first opens
  renderHome();
</script>

</body>
</html>
